# Two firmware entry files share this project; each env builds only its own
# via build_src_filter:
#   nodemcu-32s / temperature-kit -> src/temperature.cpp (DS18B20 -> Supabase/USB)
#   rain-gauge  / rain-gauge-kit  -> src/rain_gauge.cpp  (tipping bucket AP/USB)
# Kit envs add -DFRESCO_KIT=1: no compiled-in credentials, JSON over USB, and
# settings provisioned from the web dashboard (include/FrescoKit.h).

[platformio]
default_envs = nodemcu-32s

; Shared by every env.
[esp32]
; Pinned so CI and local builds produce the same binaries.
platform = espressif32@6.9.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
build_flags =
    -Iinclude

[temperature]
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

[rain]
lib_deps =
    esp32async/AsyncTCP@^3.3.2
    esp32async/ESPAsyncWebServer@^3.6.0

[env:nodemcu-32s]
extends = esp32
build_src_filter = -<*> +<temperature.cpp>
lib_deps = ${temperature.lib_deps}

[env:rain-gauge]
extends = esp32
build_src_filter = -<*> +<rain_gauge.cpp>
lib_deps = ${rain.lib_deps}

[env:temperature-kit]
extends = env:nodemcu-32s
build_flags =
    ${esp32.build_flags}
    -DFRESCO_KIT=1
lib_deps =
    ${temperature.lib_deps}
    bblanchon/ArduinoJson@^7.2.0

[env:rain-gauge-kit]
extends = env:rain-gauge
build_flags =
    ${esp32.build_flags}
    -DFRESCO_KIT=1
lib_deps =
    ${rain.lib_deps}
    bblanchon/ArduinoJson@^7.2.0
